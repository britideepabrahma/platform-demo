apiVersion: argoproj.io/v1alpha1
kind: Application
metadata: { name: jaeger, namespace: argocd }
spec:
  project: default
  source:
    repoURL: https://github.com/britideepabrahma/platform-demo   # same as root-app.yaml!
    targetRevision: main
    path: gitops/platform/jaeger
  destination: { server: https://kubernetes.default.svc, namespace: observability }
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true]