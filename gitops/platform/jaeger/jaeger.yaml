apiVersion: apps/v1
kind: Deployment
metadata: { name: jaeger, namespace: observability }
spec:
  replicas: 1
  selector: { matchLabels: { app: jaeger } }
  template:
    metadata: { labels: { app: jaeger } }
    spec:
      containers:
        - name: jaeger
          image: jaegertracing/jaeger:latest   # later: pin to the current 2.x tag from Docker Hub
          ports:
            - { name: otlp-grpc, containerPort: 4317 }
            - { name: ui, containerPort: 16686 }
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits:   { memory: 512Mi }
---
apiVersion: v1
kind: Service
metadata: { name: jaeger, namespace: observability }
spec:
  selector: { app: jaeger }
  ports:
    - { name: otlp-grpc, port: 4317, targetPort: 4317 }
    - { name: ui, port: 16686, targetPort: 16686 }