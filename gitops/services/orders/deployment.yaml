apiVersion: apps/v1
kind: Deployment
metadata: { name: orders, namespace: demo }
spec:
  replicas: 2
  selector: { matchLabels: { app: orders } }
  template:
    metadata: { labels: { app: orders } }
    spec:
      containers:
        - name: orders
          image: orders:0.1.0
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 8000 }]
          env:
            - { name: OTEL_SERVICE_NAME, value: orders }
            - { name: OTEL_EXPORTER_OTLP_ENDPOINT, value: "http://otel-collector-opentelemetry-collector.observability:4317" }
            - { name: OTEL_EXPORTER_OTLP_PROTOCOL, value: grpc }
          readinessProbe: { httpGet: { path: /healthz, port: 8000 } }
          livenessProbe:  { httpGet: { path: /healthz, port: 8000 } }
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits:   { cpu: 250m, memory: 256Mi }
---
apiVersion: v1
kind: Service
metadata: { name: orders, namespace: demo }
spec:
  selector: { app: orders }
  ports: [{ port: 80, targetPort: 8000 }]